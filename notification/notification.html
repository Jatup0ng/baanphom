<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การแจ้งเตือน - BAAN PHOM</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Rye&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/notification/notification.css">
    <link rel="website icon" type="png" href="/images/icon.jpg">
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-cut"></i>
            <div class="text">
                <span class="en">BAAN PHOM</span>
                <span class="th">บ้านผม บาร์เบอร์</span>
            </div>
        </div>
        <div class="menu-icons">
            <a href="/index.html" class="menu-icon">หน้าแรก</a>
            <a href="/booking/book.html" class="menu-icon">จองคิว</a>
            <span id="guest-nav">
                <a href="#" class="menu-icon" onclick="openLogin(event)">เข้าสู่ระบบ</a>
            </span>
            <a href="/history/history.html" class="menu-icon">ประวัติ</a>

            <!-- Notification Bell -->
            <span id="notification-nav" style="display: none; position: relative;">
                <a href="/notification/notification.html" class="menu-icon">
                    <i class="fas fa-bell"></i>
                    <span id="notif-badge" class="notif-badge" style="display: none;"></span>
                </a>
            </span>

            <span id="member-nav" style="display: none; position: relative;">
                <a href="#" class="menu-icon" onclick="toggleDropdown(event)">
                    <i class="fas fa-user-tie"></i>&nbsp;
                    <span id="user-name-display"></span>
                </a>
                <div id="userDropdown" class="dropdown-content">
                    <div class="aboutme">
                        <a href="/data-profile/data.html">
                            <i class="fas fa-user-tie"></i> ข้อมูลส่วนตัว
                        </a>
                    </div>
                    <a href="#" onclick="logout(event)" id="logoutword">
                        <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
                    </a>
                </div>
            </span>
        </div>
    </div>

    <!-- Main Content -->
    <main class="notification-main">
        <div class="notification-container">
            <h2 class="page-title">การแจ้งเตือน</h2>
            <hr class="title-divider">

            <div id="notification-list" class="notification-list">
                <!-- Notifications will be injected here by JS -->
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="loginModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeLogin()">x</span>
            <h2 style="color: #5A3E25; margin-bottom: 5px;">ยินดีต้อนรับสู่ BAAN PHOM</h2>
            <h3 style="color: #5A3E25; margin-bottom: 20px;">เข้าสู่ระบบสมาชิก</h3>
            <div class="form-group">
                <label class="form-label">ชื่อผู้ใช้</label>
                <input type="text" id="username-input" class="form-input" placeholder="ชื่อผู้ใช้">
            </div>
            <div class="form-group">
                <label class="form-label">รหัสผ่าน</label>
                <input type="password" id="password-input" class="form-input" placeholder="รหัสผ่าน">
            </div>
            <button class="login-btn" onclick="performLogin()">
                <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
            </button>
            <div class="divider"><span>หรือ</span></div>
            <p style="font-size: 14px; margin-top: 10px;">
                <a href="#" style="color: #d9534f; text-decoration: none;"
                    onclick="openForgotPassword();closeLogin(event)">ลืมรหัสผ่าน</a>
            </p>
            <p style="font-size: 14px; margin-top: 5px;">
                ยังไม่มีบัญชี? <a href="#" style="color: #8B5E3C; font-weight: bold;"
                    onclick="openRegister();closeLogin(event)">สมัครสมาชิกใหม่</a>
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/layout.js"></script>
    <script src="/js/notification.js"></script>
</body>

</html>
