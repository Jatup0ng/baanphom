<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaanPhom Barber</title>
    <link rel="stylesheet" href="/payment/payment.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rye&display=swap');
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="website icon" href="https://scontent.xx.fbcdn.net/v/t1.15752-9/620571529_26059530513644511_2166490406941772702_n.jpg?_nc_cat=101&ccb=1-7&_nc_sid=9f807c&_nc_ohc=Xj9cbgfAaXAQ7kNvwFrQOzZ&_nc_oc=AdnTqmRzVXcrasvQdc7lAOkBAn0KOGMTTs5TEMLruRU74gTCCx4hm15L-q4Wgd5Qxrj5EOyuRYv28xfvziI-oJXr&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=scontent.xx&oh=03_Q7cD4QH_02jEdFXZ37dJ5iTiT27H-UrxrVzFrod97oYSglwouQ&oe=699C2E98">
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-cut"></i>
            <div class="text">
                <span class="en">BAAN PHOM</span>
                <span class="th">บ้านผม บาร์เบอร์</span>
            </div>
            

        </div>
        <div class="menu-icon" >
            <a href="#" class="menu-icon">หน้าแรก</a>
            
            <b><a href="#" class="menu-icon">จองคิว</a></b>
            <a href="#" class="menu-icon">ประวัติ</a>
            
            <a href="#" class="menu-icon fas fa-user-alt ">User</a>
        </div>
        
        
    </div>
    <div class="payment">
        <div style="margin-left: 20px;">
        <h1>ชำระเงิน</h1>
    </div>

    <div class="payment-container">
        
        <div class="column">
            <h3 style="margin-left: 25%;">วิธีการชำระเงิน</h3>
            <div class="qcard qr-section">
                <img src="https://scontent.xx.fbcdn.net/v/t1.15752-9/599522693_774603158383442_7518024844061670756_n.jpg?_nc_cat=106&ccb=1-7&_nc_sid=fc17b8&efg=eyJxZV9ncm91cHMiOlsiaWdkX2Jlc3RfZWZmb3J0X2ltYWdlOmNvbnRyb2wiXX0%3D&_nc_ohc=5BDbr9PF3EsQ7kNvwHLIOPQ&_nc_oc=Adlt7XCU3ty4m19PGOJa0cp3mataVemtWBhb-DTj8R-d1-4OacewzpklQMHhzOS1qGIPG77jGqropwfaItiXVwm8&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=scontent.xx&oh=03_Q7cD4QHl6EO2cpiiD8BnkH6JpPB0jgsvFNU0SzgD_cZ_tOjauQ&oe=699C6E29" alt="QR Code" class="qr-image">
                
                <div class="price-text">ชื่อบัญชี : บ้านผม</div>
                <b style="font-size: 26px ; color: #593f29;">150 Bath</b>
            </div>
        </div>

        <div class="column">
            <h3>รายละเอียดการจอง</h3>
            <div class="card">
                
                <div class="detail-row">
                    <div class="label">บริการ:</div>
                    <div class="value">ตัด สระ ไดร์</div>
                </div>

                <div class="detail-row">
                    <div class="label">วัน เวลา:</div>
                    <div class="value">13/01/2026 เวลา 16.00-17.00 น.</div>
                </div>

                <div class="detail-row">
                    <div class="label">ระยะเวลา:</div>
                    <div class="value">60 นาที</div>
                </div>

                <div class="detail-row">
                    <div class="label">ค่าบริการ:</div>
                    <div class="value">
                        150 บาท <span class="status-wait">*รอชำระ</span>
                    </div>
                </div>

            </div>
        </div>

    </div>

    
    
    
    <!-- แนบสลิปการโอนเงิน -->
    <div id="paymentModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn " onclick="closePaymentModal()">x</span>
            
            <h3 style="color: #5A3E25; margin-bottom: 20px; margin-top: 25px; margin-left: 20%;">แนบสลิปการโอนเงิน</h3>
            
            <div class="upload-area" onclick="document.getElementById('slipInput').click()">
                <input type="file" id="slipInput" hidden accept="image/*" onchange="previewSlip()">
                
                <div id="uploadPlaceholder">
                    <i class="fas fa-cloud-upload-alt " style="font-size: 40px; color: #8B5E3C; margin-left: 33%;"></i>
                    <p style="color: #888; margin-top: 10px;">แตะเพื่อเลือกรูปสลิป</p>
                </div>

                <img id="slipPreview" class="slip-preview" src="" alt="ตัวอย่างสลิป">
            </div><br>

            <p id="fileName" style="font-size: 14px; color: #019c20; margin-left: 20%; display: none;"></p>

            <button class="btn-next" onclick="submitSlip()" id="confirmBtn">
                ยืนยันการโอนเงิน
            </button>
        </div>
    </div>

</div>
<script>
    // --- ฟังก์ชันจัดการ Modal ---
    function openPaymentModal() {
        document.getElementById("paymentModal").style.display = "flex";
    }

    function closePaymentModal() {
        document.getElementById("paymentModal").style.display = "";
        // (เสริม) รีเซ็ตค่าเมื่อปิด เพื่อให้พร้อมใช้ครั้งหน้า
        resetUpload(); 
    }

    // --- ฟังก์ชันแสดงรูปตัวอย่าง (Preview) ---
    function previewSlip() {
        const fileInput = document.getElementById('slipInput');
        const preview = document.getElementById('slipPreview');
        const placeholder = document.getElementById('uploadPlaceholder');
        const fileName = document.getElementById('fileName');

        const file = fileInput.files[0];

        if (file) {
            const reader = new FileReader();

            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';      // โชว์รูป
                placeholder.style.display = 'none';   // ซ่อนไอคอนอัปโหลด
                
                fileName.innerText = "ไฟล์: " + file.name;
                fileName.style.display = 'block';
            }

            reader.readAsDataURL(file);
        }
    }

    // --- ฟังก์ชันรีเซ็ต (เผื่อเปลี่ยนใจ) ---
    function resetUpload() {
        document.getElementById('slipInput').value = "";
        document.getElementById('slipPreview').style.display = 'none';
        document.getElementById('uploadPlaceholder').style.display = 'block';
        document.getElementById('fileName').style.display = 'none';
        document.getElementById('confirmBtn').innerText = "ยืนยันการโอนเงิน";
        document.getElementById('confirmBtn').disabled = false;
        document.getElementById('confirmBtn').style.backgroundColor = "#5A3E25";
    }

    // --- ฟังก์ชันจำลองการส่งข้อมูล (Simulate Submit) ---
    function submitSlip() {
        const fileInput = document.getElementById('slipInput');
        
        if (fileInput.files.length === 0) {
            alert("กรุณาเลือกรูปสลิปก่อนครับ");
            return;
        }

        // เปลี่ยนปุ่มเป็นสถานะ "กำลังตรวจสอบ"
        const btn = document.getElementById('confirmBtn');
        btn.innerText = "กำลังตรวจสอบ...";
        btn.style.backgroundColor = "#888"; // เปลี่ยนสีปุ่มให้ดูเหมือนรอ
        btn.disabled = true;

        // จำลองการรอ 2 วินาที (เหมือนส่งไปเช็ค API)
        setTimeout(() => {
            alert("✅ แจ้งโอนเงินเรียบร้อย! ระบบกำลังตรวจสอบ");
            closePaymentModal();
            // ตรงนี้อาจจะสั่งให้เปลี่ยนหน้าเว็บไปหน้าขอบคุณ หรือหน้าประวัติ
             window.location.href = "#"; 
        }, 2000);
    }
</script>


</body>
</html>
