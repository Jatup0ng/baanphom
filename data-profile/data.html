<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัญชีของฉัน - BAAN PHOM</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Rye&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/data.css">
    <link rel="website icon" type="png" href="/images/icon.jpg">
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-cut"></i>
            <div class="text">
                <span class="en">BAAN PHOM</span>
                <span class="th">บ้านผม บาร์เบอร์</span>
            </div>
        </div>
        <div class="menu-icons">
            <a href="/index.html" class="menu-icon">หน้าแรก</a>
            <a href="/booking/book.html" class="menu-icon">จองคิว</a>
            <span id="guest-nav">
                <a href="#" class="menu-icon" onclick="openLogin()">เข้าสู่ระบบ</a>
            </span>
            <a href="/history/history.html" class="menu-icon">ประวัติ</a>

            <!-- Notification Bell -->
            <a href="/notification/notification.html" class="menu-icon notif-icon-container"
                style="position: relative;">
                <i class="fas fa-bell"></i>
                <span id="notif-badge" class="notif-badge" style="display: none;"></span>
            </a>

            <span id="member-nav" style="display: none; position: relative;">
                <a href="#" class="menu-icon" onclick="toggleDropdown()">
                    <i class="fas fa-user-tie"></i>&nbsp;
                    <span id="user-name-display"></span>
                </a>
                <div id="userDropdown" class="dropdown-content">
                    <div class="aboutme">
                        <a href="/data-profile/data.html">
                            <i class="fas fa-user-tie"></i> ข้อมูลส่วนตัว
                        </a>
                    </div>
                    <a href="#" onclick="logout()" id="logoutword">
                        <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
                    </a>
                </div>
            </span>
        </div>
    </div>

    <!-- Main Content -->
    <main>
        <div class="data-container">
            <h1 class="page-title">บัญชีของฉัน</h1>
            <h2 class="sub-title">ข้อมูลส่วนตัว</h2>

            <div class="profile-card">
                <div class="form-group">
                    <label>ชื่อ*</label>
                    <div class="input-wrapper">
                        <input type="text" id="profile-firstname" class="form-control" readonly>
                        <a href="javascript:void(0)" id="btn-edit-firstname" class="edit-action">
                            <i class="fas fa-edit"></i> <span id="text-edit-firstname">แก้ไข</span>
                        </a>
                    </div>
                </div>

                <div class="form-group">
                    <label>นามสกุล</label>
                    <div class="input-wrapper">
                        <input type="text" id="profile-lastname" class="form-control" readonly placeholder="-">
                        <a href="javascript:void(0)" id="btn-edit-lastname" class="edit-action">
                            <i class="fas fa-edit"></i> <span id="text-edit-lastname">แก้ไข</span>
                        </a>
                    </div>
                </div>

                <div class="form-group">
                    <label>เบอร์โทร*</label>
                    <div class="input-wrapper">
                        <input type="text" id="profile-phone" class="form-control" readonly>
                        <a href="javascript:void(0)" id="btn-edit-phone" class="edit-action">
                            <i class="fas fa-edit"></i> <span id="text-edit-phone">แก้ไข</span>
                        </a>
                    </div>
                </div>

                <div class="form-group">
                    <label>อีเมล</label>
                    <div class="input-wrapper">
                        <input type="email" id="profile-email" class="form-control" readonly>
                        <a href="javascript:void(0)" id="btn-edit-email" class="edit-action">
                            <i class="fas fa-edit"></i> <span id="text-edit-email">แก้ไข</span>
                        </a>
                    </div>
                </div>

                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <div class="input-wrapper" style="position: relative;">
                        <input type="password" id="profile-pass" class="form-control" readonly
                            style="padding-right: 35px;">
                        <i class="fas fa-eye-slash" id="toggle-pass-visibility"
                            style="position: absolute; right: 95px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; display: none;"
                            title="แสดงรหัสผ่าน"></i>
                        <a href="javascript:void(0)" id="btn-edit-pass" class="edit-action" style="margin-left: auto;">
                            <i class="fas fa-edit"></i> <span id="text-edit-pass">แก้ไข</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="/js/layout.js"></script>
    <script src="/js/data.js"></script>
</body>

</html>
