<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัญชีของฉัน - BAAN PHOM</title>
    <link rel="stylesheet" href="../csshome.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* กำหนดฟอนต์หลักของทั้งหน้าเป็น Sarabun */
        body {
            font-family: 'Sarabun', sans-serif;
            color: #5D3A1A; /* สีน้ำตาลเข้ม */
            margin: 0;
            padding-top: 0px; /* กันเนื้อหาชน Navbar */
            background-color: #F8F4F0;
        }

        /* --- ส่วน Logo เฉพาะกิจ (เพื่อให้แสดงผลถูกต้องแม้ csshome.css โหลดไม่ทัน) --- */
        .logo .en {
            font-family: 'Rye', serif; /* ใช้ฟอนต์ Rye ให้เหมือนรูป */
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        
        .logo .th {
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
        }

        /* --- CSS เดิมของคุณ --- */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1.page-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4A2E16;
        }

        h2.sub-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #6D4C30;
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #8B5E3C;
            border-radius: 10px;
            box-sizing: border-box;
            color: #333;
            outline: none;
            font-family: 'Sarabun', sans-serif; /* บังคับใช้ฟอนต์ใน Input */
        }

        .edit-action {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            text-decoration: none;
            color: #5D3A1A;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .edit-action i {
            margin-right: 5px;
        }

        
    </style>
</head>
<body>
    
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-cut"></i>
            <div class="text">
                <span class="en">BAAN PHOM</span>
                <span class="th">บ้านผม บาร์เบอร์</span>
            </div>
        </div>
        <div class="menu-icons">
            <a href="../index.html" class="menu-icon">หน้าแรก</a>
            <a href="../booking/book.html" class="menu-icon">จองคิว</a>
            <span id="guest-nav">
                <a href="#" class="menu-icon" onclick="openLogin()">เข้าสู่ระบบ</a>
            </span>
            <a href="../history/history.html" class="menu-icon">ประวัติ</a>
            
            <span id="member-nav" style="display: none; position: relative;"> 
                <a href="javascript:void(0)" class="menu-icon" onclick="toggleDropdown()"> 
                    <i class="fas fa-user-circle"></i> 
                    <span id="user-name-display">ชื่อผู้ใช้</span> 
                </a>
                
                <div id="userDropdown" class="dropdown-content">
                    <a href="#">
                         <i class="fas fa-user-cog"></i> ข้อมูลส่วนตัว
                    </a>
                    <a href="#" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
                    </a>
                </div>
            </span>
        </div>
    </div>

    <div class="container">
        <h1 class="page-title">บัญชีของฉัน</h1>
        <h2 class="sub-title">ข้อมูลส่วนตัว</h2>

        <div class="profile-card">
            <div class="form-group">
                <label>ชื่อ*</label>
                <div class="input-wrapper">
                    <input type="text" id="profile-name" class="form-control" value="" readonly>
                    <a href="javascript:void(0)" id="btn-edit-name" class="edit-action" onclick="toggleEditName()">
                        <i class="fas fa-edit"></i> แก้ไข
                    </a>
                </div>
            </div>

            <div class="form-group">
                <label>เบอร์โทร*</label>
                <div class="input-wrapper">
                    <input type="text" id="profile-phone" class="form-control" value="064-191-1122" readonly>
                </div>
            </div>

            <div class="form-group">
                <label>อีเมล</label>
                <div class="input-wrapper">
                    <input type="email" id="profile-email" class="form-control" value="phomtud@gmail.com" readonly>
                </div>
            </div>

            <div class="form-group">
                <label>รหัสผ่าน</label>
                <div class="input-wrapper">
                    <input type="password" id="profile-pass" class="form-control" value="12345678" readonly>
                    <a href="javascript:void(0)" id="btn-edit-pass" class="edit-action" onclick="toggleEditPass()">
                        <i class="fas fa-edit"></i> แก้ไข
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ส่วนที่ 1: โหลดข้อมูลเมื่อเข้าหน้าเว็บ ---
        document.addEventListener("DOMContentLoaded", function() {
            // 1. ดึงชื่อผู้ใช้จาก LocalStorage ที่ไฟล์ JS หลักบันทึกไว้
            let currentName = localStorage.getItem("userName");
            
            // 2. ถ้ามีชื่อ ให้เอาไปใส่ในช่อง Input ชื่อ
            if (currentName) {
                document.getElementById("profile-name").value = currentName;
            } else {
                // กรณีไม่ได้ Login หรือไม่มีชื่อ ให้ใส่ค่า Default
                document.getElementById("profile-name").value = "Guest";
            }
        });

        // --- ส่วนที่ 2: ฟังก์ชันสำหรับปุ่มแก้ไขชื่อ ---
        function toggleEditName() {
            let nameInput = document.getElementById("profile-name");
            let editBtn = document.getElementById("btn-edit-name");

            // เช็คว่าตอนนี้ล็อคอยู่ไหม (readonly)
            if (nameInput.hasAttribute("readonly")) {
                // >> เข้าสู่โหมดแก้ไข
                nameInput.removeAttribute("readonly"); // ปลดล็อค
                nameInput.style.borderColor = "#007bff"; // เปลี่ยนสีขอบให้รู้ว่าแก้ได้
                nameInput.focus(); // เอาเคอร์เซอร์ไปวาง
                
                // เปลี่ยนปุ่มเป็น "บันทึก"
                editBtn.innerHTML = '<i class="fas fa-save"></i> บันทึก';
                editBtn.style.color = "#28a745"; // สีเขียว
            } else {
                // >> กดบันทึก
                let newName = nameInput.value;
                
                if(newName.trim() === "") {
                    alert("กรุณากรอกชื่อ");
                    return;
                }

                // 1. บันทึกลง LocalStorage
                localStorage.setItem("userName", newName);

                // 2. อัปเดตชื่อบน Navbar ทันที (ไม่ต้องรีเฟรช)
                let navName = document.getElementById("user-name-display");
                if(navName) navName.innerText = newName;

                // 3. ล็อคช่องเหมือนเดิม
                nameInput.setAttribute("readonly", true);
                nameInput.style.borderColor = "#8B5E3C"; // คืนสีเดิม
                
                // เปลี่ยนปุ่มกลับเป็น "แก้ไข"
                editBtn.innerHTML = '<i class="fas fa-edit"></i> แก้ไข';
                editBtn.style.color = "#5D3A1A"; // สีเดิม

                alert("บันทึกชื่อเรียบร้อยแล้ว!");
            }
        }

        // --- ส่วนที่ 3: ฟังก์ชันสำหรับปุ่มแก้ไขรหัสผ่าน (จำลองการทำงาน) ---
        function toggleEditPass() {
            let passInput = document.getElementById("profile-pass");
            let editBtn = document.getElementById("btn-edit-pass");

            if (passInput.hasAttribute("readonly")) {
                // เข้าสู่โหมดแก้ไข
                passInput.removeAttribute("readonly");
                passInput.type = "text"; // แสดงรหัสผ่านเพื่อให้แก้ได้ง่าย
                passInput.style.borderColor = "#007bff";
                passInput.focus();

                editBtn.innerHTML = '<i class="fas fa-save"></i> บันทึก';
                editBtn.style.color = "#28a745";
            } else {
                // บันทึก
                passInput.setAttribute("readonly", true);
                passInput.type = "password"; // ซ่อนรหัสผ่านกลับ
                passInput.style.borderColor = "#8B5E3C";

                editBtn.innerHTML = '<i class="fas fa-edit"></i> แก้ไข';
                editBtn.style.color = "#5D3A1A";

                alert("บันทึกรหัสผ่านเรียบร้อยแล้ว!");
            }
        }
    </script>
    <script src="../javaScript.js"></script>
</body>
</html>
