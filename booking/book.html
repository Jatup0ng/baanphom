<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../csshome.css">
    <link rel="stylesheet" href="book.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rye&display=swap');
    </style>
    <link rel="website icon" href="https://scontent.xx.fbcdn.net/v/t1.15752-9/620571529_26059530513644511_2166490406941772702_n.jpg?_nc_cat=101&ccb=1-7&_nc_sid=9f807c&_nc_ohc=Xj9cbgfAaXAQ7kNvwFrQOzZ&_nc_oc=AdnTqmRzVXcrasvQdc7lAOkBAn0KOGMTTs5TEMLruRU74gTCCx4hm15L-q4Wgd5Qxrj5EOyuRYv28xfvziI-oJXr&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=scontent.xx&oh=03_Q7cD4QH_02jEdFXZ37dJ5iTiT27H-UrxrVzFrod97oYSglwouQ&oe=699C2E98">

    <script src="book.js"></script>
</head>
<body>

    <div class="navbar">
        <div class="logo">
            <i class="fas fa-cut"></i>
            <div class="text">
                <span class="en">BAAN PHOM</span>
                <span class="th">บ้านผม บาร์เบอร์</span>
            </div>
            

        </div>
        <div class="menu-icons" >
            <a href="../index.html" class="menu-icon">หน้าแรก</a>
            <b><a href="book.html" class="menu-icon">จองคิว</a></b>
            <span id="guest-nav">
                <a href="#" class="menu-icon" onclick="openLogin()">เข้าสู่ระบบ</a>
            </span>
            <a href="../history/history.html" class="menu-icon">ประวัติ</a>
            <span id="member-nav" style="display: none; position: relative;">
                <a href="#" class="menu-icon" onclick="toggleDropdown()">
                    <i class="fas fa-user-circle"></i> 
                    <span id="user-name-display"></span>
                    
                </a>
                <div id="userDropdown" class="dropdown-content">
                    <div class="aboutme">
                        <a href="../data-profile/index.html" >
                            <i class="fas fa-user-circle"></i> ข้อมูลส่วนตัว
                        </a>
                    </div>
                    <a href="#" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
                    </a>
                </div>
            </span>
            
        </div>
        
        
    </div><br>
    <h2 style="margin-left: 80px; color: #5A3E25;">จองคิว</h2>
    <div class="all_block">
        <div class="booking-container">
            <div class="boxone">
                <h3>เลือกช่างและบริการ</h3><br>
                <div class="form-group">
                    <label class="form-label">บริการ</label>
                    <select id="inputService" class="form-input" onchange="updatePrice()">
                        <option value="" selected>เลือกบริการ</option>
                        <option value="ตัด สระ ไดร์">ตัด สระ ไดร์</option>
                    </select>
                </div>

                
                <div class="form-group">
                    <label class="form-label">ช่างตัดผม</label>
                    <select id="barber-select" class="form-input">
                        <option value="" disabled selected>เลือกช่าง</option>
                        <option value="ช่างA">ช่างA</option>
                        
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">ราคา</label>
                    <input type="text" id="priceInput" class="form-input" placeholder="ราคา - บาท" readonly>  
                </div>


            </div>

                <div class="boxtwo">
                    <h3>เลือกวันและเวลา</h3><br>
                    <div class="form-group ">
                        <label class="form-label">วันที่ต้องการจอง</label>
                        <input type="date" class="form-input" id="inputDate"> 
                    </div> 

                    <div class="form-group">
                        <label class="form-label">เวลาที่ต้องการจอง</label>
                        <select id="inputTime" class="form-input">
                            <option value="" disabled selected>เลือกเวลา</option>
                            <option value="11.00 - 12.00">11.00 - 12.00</option>
                            <option value="12.00 - 13.00">12.00 - 13.00</option>
                            <option value="13.00 - 14.00">13.00 - 14.00</option>
                            <option value="14.00 - 15.00">14.00 - 15.00</option>
                            <option value="15.00 - 16.00">15.00 - 16.00</option>
                            <option value="16.00 - 17.00">16.00 - 17.00</option>
                            <option value="17.00 - 18.00">17.00 - 18.00</option>
                            <option value="18.00 - 19.00">18.00 - 19.00</option>
                            <option value="19.00 - 20.00">19.00 - 20.00</option>
                            <option value="20.00 - 21.00">20.00 - 21.00</option>
                            
                        </select>
                    </div>
                    
                </div>

                
        </div>
       
    
    </div>
    <div class="box_about">
        <h3>ข้อมูลผู้จอง</h3><br>
        <div class="form-group" style="display: flex;  gap: 20px;" >
            <div style="flex: 1;">
                <label class="form-label">ชื่อ</label>
                <input type="text" class="form-input" placeholder="-" readonly>
            </div>
             <div style="flex: 1;">
                <label class="form-label">เบอร์โทร</label>
                <input type="text" class="form-input" placeholder="-" readonly>
            </div>
            
        </div>
        <div class="form-group" style="display: flex; margin-top: 20px; gap: 20px;" >
            <div style="flex: 1;">
                <label class="form-label">Email</label>
                <input type="text" class="form-input" placeholder="-" readonly>
            </div>
            <div style="flex: 1;">
                <label class="form-label">หมายเหตุ</label>
                <input type="text" class="form-input" placeholder="-" readonly>
            </div>
            
        </div>
            <a onclick="saveAndGoNext()"><button class="btn-next">
                ถัดไป
            </button></a>
        
    </div>

    
</body>
