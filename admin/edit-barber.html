<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">จัดการช่าง - BAAN PHOM ADMIN</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Rye&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/admin_layout.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="website icon" type="png" href="/images/icon.jpg">
</head>

<body style="background-color: var(--bg-cream);">

    <!-- Admin Navbar -->
    <div class="admin-navbar">
        <div class="logo">
            <i class="fas fa-cut"></i>
            <div class="text">
                <span class="en">BAAN PHOM</span>
                <span class="th">บ้านผม บาร์เบอร์</span>
            </div>
        </div>
        <div class="menu-icons">
            <a href="/admin/adminhome.html" class="menu-icon">แดชบอร์ด</a>
            <a href="/admin/queue.html" class="menu-icon">จัดการคิว</a>
            <a href="/admin/service.html" class="menu-icon active">จัดบริการและช่าง</a>
            <a href="/admin/time.html" class="menu-icon">จัดตารางเวลา</a>

            <span id="admin-nav" style="position: relative;">
                <a href="#" class="menu-icon" id="admin-dropdown-trigger">
                    <i class="fas fa-user-shield"></i>&nbsp;
                    <span id="admin-name-display">Admin</span>
                </a>
            </span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="admin-container">
        <div class="edit-form-card">
            <div class="edit-form-header">
                <h2 id="form-title"><i class="fas fa-user-plus"></i> เพิ่มช่างใหม่</h2>
                <p id="form-subtitle" style="color: #888;">จัดการข้อมูลช่างตัดผมในร้านของคุณ</p>
            </div>

            <form id="edit-barber-form">
                <div class="form-group">
                    <label class="form-label">ชื่อช่างตัดผม</label>
                    <input type="text" id="barber-name" class="form-input" placeholder="เช่น ช่างบอย" required>
                </div>

                <div class="form-group">
                    <label class="form-label">บริการ (ที่เชี่ยวชาญ)</label>
                    <input type="text" id="barber-service" class="form-input" placeholder="เช่น ตัดผมชาย, สระซอย"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label">ค่าบริการเพิ่มเติม (บาท)</label>
                    <input type="number" id="barber-fee" class="form-input" placeholder="เช่น 0 หรือ 50" value="0"
                        required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-back-cancel"
                        onclick="window.location.href='/admin/service.html'">ยกเลิก</button>
                    <button type="submit" id="submit-btn" class="btn-save">เพิ่มช่าง</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/useBooking.js"></script>
    <script src="/js/admin_layout.js"></script>
    <script src="/js/alerts.js"></script>
    <script src="/js/admin_edit_barber.js"></script>
</body>

</html>
